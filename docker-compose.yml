services:
  tradingagents:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${TRADINGAGENTS_WEB_PORT:-5000}:8000"
    volumes:
      - tradingagents_data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 3G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tradingagents_data:
