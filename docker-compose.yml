services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradingagents}
      POSTGRES_USER: ${POSTGRES_USER:-tradingagents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradingagents_local_change_me}
    volumes:
      - tradingagents_postgres_data:/var/lib/postgresql/data
    ports:
      # 供本机直接运行 uvicorn 时复用同一个 PostgreSQL；仅监听回环地址。
      - "127.0.0.1:${TRADINGAGENTS_POSTGRES_PORT:-15432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  tradingagents:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TRADINGAGENTS_LOG_DIR: /data/runtime-logs/web
      TRADINGAGENTS_LOG_RETENTION_DAYS: "3"
      NEWS_DATABASE_URL: ${NEWS_DATABASE_URL:-postgresql://${POSTGRES_USER:-tradingagents}:${POSTGRES_PASSWORD:-tradingagents_local_change_me}@postgres:5432/${POSTGRES_DB:-tradingagents}}
      TRADINGAGENTS_CHECKPOINT_DATABASE_URL: ${TRADINGAGENTS_CHECKPOINT_DATABASE_URL:-postgresql://${POSTGRES_USER:-tradingagents}:${POSTGRES_PASSWORD:-tradingagents_local_change_me}@postgres:5432/${POSTGRES_DB:-tradingagents}}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TRADINGAGENTS_WEB_PORT:-5000}:8000"
    volumes:
      - tradingagents_data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 3G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # AI 资讯采集 Worker：与 web 服务共用同一镜像和数据卷，独立常驻进程。
  news-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "web.news_worker", "--metrics"]
    env_file:
      - .env
    environment:
      TRADINGAGENTS_LOG_DIR: /data/runtime-logs/news-worker
      TRADINGAGENTS_LOG_RETENTION_DAYS: "3"
      NEWS_DATABASE_URL: ${NEWS_DATABASE_URL:-postgresql://${POSTGRES_USER:-tradingagents}:${POSTGRES_PASSWORD:-tradingagents_local_change_me}@postgres:5432/${POSTGRES_DB:-tradingagents}}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tradingagents_data:/data
    ports:
      # 9091 可能被本机其他服务占用；容器内仍固定使用 9091，Prometheus
      # 通过 Compose 网络访问 news-worker:9091，不受宿主机端口影响。
      - "${TRADINGAGENTS_NEWS_METRICS_PORT:-9092}:9091"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "web.news_worker", "--health"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3

  # Prometheus 监控服务
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tradingagents_data:
  tradingagents_postgres_data:
  prometheus_data:
